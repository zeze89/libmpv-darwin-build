name: ci

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  ci:
    name: ci
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-arm64-Readme.md
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Platform info
        run: |
          printf "%-23s %s\n" "ProductName:"    "$(/usr/bin/sw_vers -productName)"
          printf "%-23s %s\n" "ProductVersion:" "$(/usr/bin/sw_vers -productVersion)"
          printf "%-23s %s\n" "BuildVersion:"   "$(/usr/bin/sw_vers -buildVersion)"
          printf "%-23s %s\n" "Arch:"           "$(uname -m)"

      - uses: actions/checkout@v6

      # Nightmare TV: the filter whitelist must survive a rebase on upstream.
      #
      # This exact list was lost once already, on the Windows fork: a branch
      # was created from a fresh upstream base, every --enable-filter= line
      # went with it, the build succeeded, the binary still contained the
      # string "bwdif", and four features shipped dead for eleven days
      # (deinterlacing, noise reduction, picture tuning, audio levelling).
      #
      # A comment inside meson.build cannot prevent that, because rebasing
      # replaces that file. This step can: it runs before Nix is even
      # installed, so a lost list costs one red minute instead of a release.
      - name: Nightmare filter whitelist must be present
        run: |
          f=nix/packages/mk-pkg-ffmpeg/meson.build
          missing=""
          for x in yadif bwdif scale format null copy setpts \
                   atadenoise unsharp gradfun \
                   aformat aresample anull asetpts dynaudnorm loudnorm; do
            grep -q -- "--enable-filter=$x'" "$f" || missing="$missing filter:$x"
          done
          for x in spdif mpegts matroska; do
            grep -q -- "--enable-muxer=$x'" "$f" || missing="$missing muxer:$x"
          done
          if [ -n "$missing" ]; then
            echo "$f is missing:$missing"
            echo "These are not optional extras. Without scale/format the lavfi"
            echo "graph cannot convert pixel formats and mpv disables the"
            echo "deinterlacer outright, silently. Restore the block."
            exit 1
          fi
          echo "filter whitelist: all 19 entries present"

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - name: Nix version
        run: nix --version

      - name: Show Nix config
        run: nix config show

      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      # See ${workspace}/nix/overlays/xcode.nix
      - name: Xcode path
        id: xcode_path
        run: |
          XCODE_PATH=$(realpath /Applications/Xcode_16.1.0.app)

          ${XCODE_PATH}/Contents/Developer/usr/bin/xcodebuild -version

          echo "xcode_path=${XCODE_PATH}" >> $GITHUB_OUTPUT

      - name: Build version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # See ${workspace}/Makefile
      - name: Build
        env:
          XCODE_PATH: ${{ steps.xcode_path.outputs.xcode_path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          nix develop -c make XCODE_PATH=${XCODE_PATH} VERSION=${VERSION}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: |
            result/*.tar.gz
            result/*.zip

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: |
            result/*.tar.gz
            result/*.zip
