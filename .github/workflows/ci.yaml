name: ci

on:
  push:
    branches:
      - main
      # Nightmare TV iOS line: a branch push builds and checks without
      # releasing; the ios-v1 tag on the same commit publishes.
      - ios-v1
    tags:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  ci:
    name: ci
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-arm64-Readme.md
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Platform info
        run: |
          printf "%-23s %s\n" "ProductName:"    "$(/usr/bin/sw_vers -productName)"
          printf "%-23s %s\n" "ProductVersion:" "$(/usr/bin/sw_vers -productVersion)"
          printf "%-23s %s\n" "BuildVersion:"   "$(/usr/bin/sw_vers -buildVersion)"
          printf "%-23s %s\n" "Arch:"           "$(uname -m)"

      - uses: actions/checkout@v6

      # Nightmare TV: the filter whitelist must survive a rebase on upstream.
      #
      # This exact list was lost once already, on the Windows fork: a branch
      # was created from a fresh upstream base, every --enable-filter= line
      # went with it, the build succeeded, the binary still contained the
      # string "bwdif", and four features shipped dead for eleven days
      # (deinterlacing, noise reduction, picture tuning, audio levelling).
      #
      # A comment inside meson.build cannot prevent that, because rebasing
      # replaces that file. This step can: it runs before Nix is even
      # installed, so a lost list costs one red minute instead of a release.
      - name: Nightmare filter whitelist must be present
        run: |
          f=nix/packages/mk-pkg-ffmpeg/meson.build
          missing=""
          for x in yadif bwdif scale format null copy setpts \
                   atadenoise unsharp gradfun \
                   aformat aresample anull asetpts dynaudnorm loudnorm; do
            grep -q -- "--enable-filter=$x'" "$f" || missing="$missing filter:$x"
          done
          for x in spdif mpegts matroska; do
            grep -q -- "--enable-muxer=$x'" "$f" || missing="$missing muxer:$x"
          done
          for x in truehd mlp cc_dec vc1; do
            grep -q -- "--enable-decoder=$x'" "$f" || missing="$missing decoder:$x"
          done
          for x in rtp sdp; do
            grep -q -- "--enable-demuxer=$x'" "$f" || missing="$missing demuxer:$x"
          done
          grep -q -- "--enable-encoder=png'" "$f" || missing="$missing encoder:png"
          if [ -n "$missing" ]; then
            echo "$f is missing:$missing"
            echo "These are not optional extras. Without scale/format the lavfi"
            echo "graph cannot convert pixel formats and mpv disables the"
            echo "deinterlacer outright, silently. Restore the block."
            exit 1
          fi
          echo "whitelist: filters, muxers, decoders, demuxers and encoder present"

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - name: Nix version
        run: nix --version

      - name: Show Nix config
        run: nix config show

      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      # See ${workspace}/nix/overlays/xcode.nix
      - name: Xcode path
        id: xcode_path
        run: |
          XCODE_PATH=$(realpath /Applications/Xcode_16.1.0.app)

          ${XCODE_PATH}/Contents/Developer/usr/bin/xcodebuild -version

          echo "xcode_path=${XCODE_PATH}" >> $GITHUB_OUTPUT

      - name: Build version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # See ${workspace}/Makefile
      #
      # Nightmare TV iOS line (ios-v1): only the iOS video-default
      # xcframeworks are built (device arm64 + simulator arm64/x86_64). The
      # FFmpeg component list is the same meson.build as mac-v4, so iOS gets
      # the same filters and muxers macOS ships with. macOS keeps using the
      # mac-v4 release; nothing here touches it.
      - name: Build
        env:
          XCODE_PATH: ${{ steps.xcode_path.outputs.xcode_path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          nix develop -c make XCODE_PATH=${XCODE_PATH} VERSION=${VERSION}             TARGET=mk-out-archive-xcframeworks-ios-universal-video-default
          ls -la result/

      # Nightmare TV: every shipped iOS slice must carry the component list.
      # FFmpeg embeds its configure line in libavutil; the filters and muxers
      # are also checked by AVOption names that only exist when the component
      # is compiled in (a filter NAME in a binary is not evidence; measured on
      # Windows). Licence: --enable-gpl / --enable-nonfree must be absent.
      - name: iOS slices must carry the Nightmare component list
        run: |
          set -e
          t=$(ls result/libmpv-xcframeworks_*_ios-universal-video-default.tar.gz | head -1)
          [ -n "$t" ] || { echo "::error::ios-universal-video-default tarball not found"; exit 1; }
          X="$RUNNER_TEMP/iosx"; mkdir -p "$X" && tar -xzf "$t" -C "$X"
          find "$X" -maxdepth 3 -type d -name 'ios-*' | sort
          bad=""
          slices=0
          for avu in $(find "$X" -path '*Avutil.xcframework/*/Avutil.framework/Avutil' -type f | sort); do
            sdir=$(dirname "$(dirname "$avu")")
            flt=$(find "$(dirname "$(dirname "$sdir")")/Avfilter.xcframework/$(basename "$sdir")" -name Avfilter -type f | head -1)
            fmt=$(find "$(dirname "$(dirname "$sdir")")/Avformat.xcframework/$(basename "$sdir")" -name Avformat -type f | head -1)
            for a in $(lipo -archs "$avu"); do
              slices=$((slices+1))
              tag="$(basename "$sdir")/$a"
              lipo "$avu" -thin "$a" -output "$RUNNER_TEMP/avu_$a" 2>/dev/null || cp "$avu" "$RUNNER_TEMP/avu_$a"
              conf=$(strings "$RUNNER_TEMP/avu_$a" | grep -m1 -- '--prefix=' || true)
              echo "== $tag"
              echo "$conf" | tr ' ' '
' | grep -E -- '^--(enable-(filter|muxer|protocol|gpl|nonfree|version3|videotoolbox)|disable-gpl)' | sort | tr '
' ' '; echo
              for opt in --enable-version3 --enable-videotoolbox                          --enable-filter=yadif --enable-filter=bwdif --enable-filter=scale                          --enable-filter=format --enable-filter=null --enable-filter=copy                          --enable-filter=setpts --enable-filter=atadenoise --enable-filter=unsharp                          --enable-filter=gradfun --enable-filter=aformat --enable-filter=aresample                          --enable-filter=anull --enable-filter=asetpts --enable-filter=dynaudnorm                          --enable-filter=loudnorm --enable-filter=overlay --enable-filter=equalizer                          --enable-muxer=spdif --enable-muxer=mpegts --enable-muxer=matroska                          --enable-demuxer=rtp --enable-demuxer=sdp --enable-decoder=truehd                          --enable-decoder=cc_dec --enable-encoder=png; do
                case "$conf" in *"$opt"*) ;; *) bad="$bad $tag:$opt" ;; esac
              done
              for opt in --enable-gpl --enable-nonfree; do
                case "$conf" in *"$opt"*) bad="$bad $tag:LICENCE$opt" ;; esac
              done
              if [ "$a" = x86_64 ]; then
                case "$conf" in *--enable-x86asm*) ;; *) bad="$bad $tag:--enable-x86asm" ;; esac
              fi
              for pair in force_original_aspect_ratio:scale pix_fmts:format atadenoise:atadenoise                           luma_msize_x:unsharp measured_I:loudnorm gausssize:dynaudnorm send_field:bwdif; do
                m="${pair%%:*}"; f="${pair##*:}"
                grep -q -a -- "$m" "$flt" || bad="$bad $tag:filter-marker:$f"
              done
              for pair in reserve_index_space:matroska mpegts_flags:mpegts; do
                m="${pair%%:*}"; f="${pair##*:}"
                grep -q -a -- "$m" "$fmt" || bad="$bad $tag:muxer-marker:$f"
              done
            done
          done
          echo "slices checked: $slices"
          [ "$slices" -ge 3 ] || bad="$bad expected>=3-slices(got-$slices)"
          if [ -n "$bad" ]; then echo "::error::missing:$bad"; exit 1; fi
          echo "iOS component list: all slices OK (LGPL, no --enable-gpl/--enable-nonfree)"

      - name: SHA256 sums
        run: |
          mkdir -p "$RUNNER_TEMP/sums"
          (cd result && shasum -a 256 *.tar.gz *.zip) | tee "$RUNNER_TEMP/sums/SHA256SUMS.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          retention-days: 5
          path: |
            result/*.tar.gz
            result/*.zip
            ${{ runner.temp }}/sums/SHA256SUMS.txt

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: |
            result/*.tar.gz
            result/*.zip
            ${{ runner.temp }}/sums/SHA256SUMS.txt
