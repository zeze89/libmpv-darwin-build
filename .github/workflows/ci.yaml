name: ci

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  ci:
    name: ci
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-arm64-Readme.md
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Platform info
        run: |
          printf "%-23s %s\n" "ProductName:"    "$(/usr/bin/sw_vers -productName)"
          printf "%-23s %s\n" "ProductVersion:" "$(/usr/bin/sw_vers -productVersion)"
          printf "%-23s %s\n" "BuildVersion:"   "$(/usr/bin/sw_vers -buildVersion)"
          printf "%-23s %s\n" "Arch:"           "$(uname -m)"

      - uses: actions/checkout@v6

      # Nightmare TV: the filter whitelist must survive a rebase on upstream.
      #
      # This exact list was lost once already, on the Windows fork: a branch
      # was created from a fresh upstream base, every --enable-filter= line
      # went with it, the build succeeded, the binary still contained the
      # string "bwdif", and four features shipped dead for eleven days
      # (deinterlacing, noise reduction, picture tuning, audio levelling).
      #
      # A comment inside meson.build cannot prevent that, because rebasing
      # replaces that file. This step can: it runs before Nix is even
      # installed, so a lost list costs one red minute instead of a release.
      - name: Nightmare filter whitelist must be present
        run: |
          f=nix/packages/mk-pkg-ffmpeg/meson.build
          missing=""
          for x in yadif bwdif scale format null copy setpts \
                   atadenoise unsharp gradfun \
                   aformat aresample anull asetpts dynaudnorm loudnorm; do
            grep -q -- "--enable-filter=$x'" "$f" || missing="$missing filter:$x"
          done
          for x in spdif mpegts matroska; do
            grep -q -- "--enable-muxer=$x'" "$f" || missing="$missing muxer:$x"
          done
          for x in truehd mlp cc_dec vc1; do
            grep -q -- "--enable-decoder=$x'" "$f" || missing="$missing decoder:$x"
          done
          for x in rtp sdp; do
            grep -q -- "--enable-demuxer=$x'" "$f" || missing="$missing demuxer:$x"
          done
          grep -q -- "--enable-encoder=png'" "$f" || missing="$missing encoder:png"
          if [ -n "$missing" ]; then
            echo "$f is missing:$missing"
            echo "These are not optional extras. Without scale/format the lavfi"
            echo "graph cannot convert pixel formats and mpv disables the"
            echo "deinterlacer outright, silently. Restore the block."
            exit 1
          fi
          echo "whitelist: filters, muxers, decoders, demuxers and encoder present"

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - name: Nix version
        run: nix --version

      - name: Show Nix config
        run: nix config show

      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      # See ${workspace}/nix/overlays/xcode.nix
      - name: Xcode path
        id: xcode_path
        run: |
          XCODE_PATH=$(realpath /Applications/Xcode_16.1.0.app)

          ${XCODE_PATH}/Contents/Developer/usr/bin/xcodebuild -version

          echo "xcode_path=${XCODE_PATH}" >> $GITHUB_OUTPUT

      - name: Build version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # See ${workspace}/Makefile
      - name: Build
        env:
          XCODE_PATH: ${{ steps.xcode_path.outputs.xcode_path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          nix develop -c make XCODE_PATH=${XCODE_PATH} VERSION=${VERSION}

      # Nightmare TV: the Intel slice must carry x86 SIMD (mac-v3 onwards).
      # mac-v2 shipped pure C on Intel because disable_all_options turns
      # x86asm off and nothing turned it back on. FFmpeg embeds its configure
      # line in libavutil, so read it from the x86_64 slice that ships.
      - name: Intel slice must be built with x86 SIMD
        run: |
          t=$(ls result/libmpv-xcframeworks_*_macos-universal-video-default.tar.gz | head -1)
          [ -n "$t" ] || { echo "::error::macos-universal-video-default tarball not found"; exit 1; }
          mkdir -p "$RUNNER_TEMP/simd" && tar -xzf "$t" -C "$RUNNER_TEMP/simd"
          f=$(find "$RUNNER_TEMP/simd" -path '*macos-arm64_x86_64/Avutil.framework/Avutil' | head -1)
          lipo "$f" -thin x86_64 -output "$RUNNER_TEMP/avutil_x86_64"
          conf=$(strings "$RUNNER_TEMP/avutil_x86_64" | grep -m1 -- '--prefix=' || true)
          for opt in --enable-x86asm --enable-runtime-cpudetect; do
            case "$conf" in
              *"$opt"*) echo "x86_64 avutil configure has $opt" ;;
              *) echo "::error::x86_64 slice was configured without $opt"; exit 1 ;;
            esac
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: |
            result/*.tar.gz
            result/*.zip

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: |
            result/*.tar.gz
            result/*.zip
